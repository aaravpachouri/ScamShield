<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#070b13" />
    <meta name="robots" content="noindex, follow" />
    <title>Page not found | ScamShield</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      :root { color-scheme: dark; font-family: Manrope, Inter, system-ui, sans-serif; background: #070b13; color: #f4f7fb; }
      * { box-sizing: border-box; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; background: radial-gradient(ellipse at 50% 0%, #172d35 0, #070b13 62%); }
      main { width: min(100%, 620px); padding: 52px 30px; text-align: center; border: 1px solid #293845; border-radius: 24px; background: rgba(12,19,30,.92); box-shadow: 0 24px 80px rgba(0,0,0,.32); }
      .mark { width: 58px; height: 58px; display: grid; place-items: center; margin: 0 auto 24px; border: 1px solid #477a6c; border-radius: 18px; color: #8ce8bd; font-size: 28px; }
      .code { color: #8ce8bd; font: 500 12px ui-monospace, monospace; letter-spacing: .2em; }
      h1 { margin: 12px 0; font-size: clamp(32px, 7vw, 48px); letter-spacing: -.045em; }
      p { max-width: 430px; margin: 0 auto 28px; color: #a9b7c5; line-height: 1.75; }
      nav { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; }
      a { display: inline-flex; min-height: 46px; align-items: center; justify-content: center; padding: 0 20px; border: 1px solid #3a4b59; border-radius: 999px; color: #f4f7fb; text-decoration: none; font-weight: 700; }
      a.primary { border-color: #8ce8bd; background: #8ce8bd; color: #08140f; }
      a:focus-visible { outline: 3px solid #fff; outline-offset: 4px; }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">⌁</div>
      <div class="code">ERROR 404</div>
      <h1>This page doesn't look familiar.</h1>
      <p>The address may be incorrect or the page may have moved. Return to ScamShield to inspect a message, link or screenshot.</p>
      <nav aria-label="Helpful links">
        <a class="primary" href="/">Back to ScamShield</a>
        <a href="/#playground">Open analysis workspace</a>
      </nav>
    </main>
  </body>
</html>
